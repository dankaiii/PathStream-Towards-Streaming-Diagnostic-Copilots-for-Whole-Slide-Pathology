# Paths are relative to the release root unless absolute.
model: models/Qwen3-VL-4B-Instruct
model_key: qwen3_vl_4b
dataset_root: datasets
feature_root: features
output_root: outputs
path_map: []
# By default sessions carry matched_frames directly. To use separate annotations,
# set both paths relative to dataset_root.
contexts_file: null
matches_file: null
wandb_project: null

seed: 20261015
world_size: 4
workers: 6
accumulation: 2
epochs: 2
warmup_ratio: 0.05
eval_steps: 100
patience: 3
loss_chunk_size: 1024
max_pixels: 100352
lora_r: 128
lora_alpha: 256

attention:
  layer_index: 24
  background_alpha: 0.1
  max_query_tokens: 64
  query_chunk_size: 32

stages:
  stage1:
    data_dir: .
    train_split: train
    validation_split: val
    learning_rate: 0.0001
    ce_mode: token_mean
    losses:
      gate_ce:             {enabled: true, weight: 1.0}
      description_ce:      {enabled: true, weight: 1.0}
      diagnosis_ce:        {enabled: true, weight: 1.0}
      diagnosis_attention: {enabled: true, weight: 0.001}
  stage2:
    data_dir: .
    train_split: train
    validation_split: val
    learning_rate: 0.00001
    ce_mode: group_mean
    losses:
      gate_ce:             {enabled: true, weight: 0.2}
      description_ce:      {enabled: true, weight: 0.1}
      diagnosis_ce:        {enabled: true, weight: 0.7}
      diagnosis_attention: {enabled: true, weight: 0.001}

# Pre-merger feature extraction (python -m data.features.cache_vision --controller).
frame_reader_python: null  # Use the active Python interpreter.
cache_frame_batch_size: 128
cache_read_workers: 8
cache_prefetch_sessions: 16
cache_prefetch_batches: 4
cache_write_backlog: 2
cache_max_read_pixels: 100000000
